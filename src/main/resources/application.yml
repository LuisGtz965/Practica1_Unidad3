spring:
  application:
    name: secure-backend

server:
  # Puerto HTTPS (TLS)
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore/devkeystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: ${SSL_KEY_ALIAS:securebackend}
    # Solo TLS 1.2 y 1.3: SSLv3, TLS 1.0 y TLS 1.1 quedan rechazados
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

app:
  # Conector HTTP (solo para redirigir a HTTPS; no sirve contenido)
  http-redirect:
    enabled: true
    port: ${HTTP_REDIRECT_PORT:8080}
  security:
    cors:
      # Origenes permitidos para el frontend (Angular)
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:4200,http://localhost:4200}
    jwt:
      # Clave HMAC en Base64 (>= 256 bits). CAMBIAR en cualquier entorno real mediante variable JWT_SECRET.
      secret: ${JWT_SECRET:Fh9YbIS/y2Bp4xQo+nVrBIBhum8EsDtVSX/lkBRiWDtoNYT3gkQe/2HtNJkpwL10}
      issuer: secure-backend
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

logging:
  level:
    SECURITY_AUDIT: INFO
    # Para diagnosticar errores de handshake TLS en el servidor, subir a DEBUG:
    # org.apache.tomcat.util.net.NioEndpoint: DEBUG
    org.apache.tomcat.util.net: INFO
